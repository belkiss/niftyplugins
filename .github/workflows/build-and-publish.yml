---
name: Build

on:
  push:
  pull_request:
    types: [opened, reopened]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: ['Debug', 'Debug Legacy', 'Release', 'Release Legacy']

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true

      VsixManifestPath: ${{ contains(matrix.configuration, 'Legacy') && 'NiftyPerforce\Manifests\Legacy\source.extension.vsixmanifest' || 'NiftyPerforce\Manifests\source.extension.vsixmanifest' }}
      VsixManifestSourcePath: ${{ contains(matrix.configuration, 'Legacy') && 'NiftyPerforce\Manifests\Legacy\source.extension.cs' || 'NiftyPerforce\Manifests\source.extension.cs' }}

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3.0.0

      - name: Increment VSIX version
        id: vsix_version
        uses: timheuer/vsix-version-stamp@v2
        with:
          manifest-file: ${{ env.VsixManifestPath }}
          vsix-token-source-file: ${{ env.VsixManifestSourcePath }}

      # Restore the application to populate the obj folder with RuntimeIdentifiers
      - name: Build NiftyPerforce in ${{ matrix.configuration }} and analyze
        shell: powershell
        run: |
          dotnet msbuild -t:build -restore NiftyPlugins.sln /nologo /v:m /p:DeployExtension=false /p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any

      - name: Run tests
        run: |
          dotnet test -restore NiftyPlugins.sln /nologo /v:m /p:DeployExtension=false /p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 'NiftyPerforce-${{ matrix.configuration }}-${{github.sha}}'
          path: NiftyPerforce\bin\${{ matrix.configuration }}\net472\NiftyPerforce*.vsix
